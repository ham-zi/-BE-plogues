# Test-only configuration: no local application.yml or external service credentials needed.
spring.application.name=plogues-test
spring.datasource.url=jdbc:h2:mem:plogues-context;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.mail.host=localhost
spring.mail.port=2525
spring.ai.ollama.base-url=http://localhost:11434

mybatis.configuration.jdbc-type-for-null=VARCHAR
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.iso.plogues

# Public dummy values used only to construct beans in tests.
cloud.aws.credentials.access-key=test-access-key
cloud.aws.credentials.secret-key=test-secret-key
cloud.region.static=ap-northeast-2
cloud.s3.bucket=plogues-test
